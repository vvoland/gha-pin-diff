name: 'Action Pin Diff'
description: 'Comments on PRs with a diff summary for pinned GitHub Actions and Neovim lazy-lock.json updates'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
  fail-on-mismatch:
    description: 'Fail the workflow when a tag/SHA mismatch is detected'
    required: false
    default: 'true'
runs:
  using: 'node24'
  main: 'dist/main.js'
branding:
  icon: 'git-pull-request'
  color: 'blue'
