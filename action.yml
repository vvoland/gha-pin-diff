name: 'Action Pin Diff'
description: 'Comments on PRs with a diff summary when GitHub Actions are updated via SHA pinning'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Run gha-pin-diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
        esac

        EXT=""
        case "$OS" in
          mingw*|msys*|cygwin*|windows_nt)
            OS="windows"
            EXT=".exe"
            ;;
        esac

        BIN="${{ github.action_path }}/dist/${OS}/${ARCH}/gha-pin-diff${EXT}"
        if [ ! -f "$BIN" ]; then
          echo "::error::No pre-built binary for ${OS}/${ARCH} (checked: ${BIN})"
          echo "Available binaries in dist/:"
          find "${{ github.action_path }}/dist" -type f 2>/dev/null || true
          exit 1
        fi
        chmod +x "$BIN"
        exec "$BIN"
branding:
  icon: 'git-pull-request'
  color: 'blue'
