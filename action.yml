name: 'Action Pin Diff'
description: 'Comments on PRs with a diff summary when GitHub Actions are updated via SHA pinning'
inputs:
  github-token:
    description: 'GitHub token for API access'
    required: true
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Run gha-pin-diff
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: node "${{ github.action_path }}/dist/main.js"
branding:
  icon: 'git-pull-request'
  color: 'blue'
