name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.1'

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage summary
        run: |
          {
            echo "## Test Coverage Report"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Get overall coverage
          COVERAGE=$(go tool cover -func=coverage.out | \
            grep total | \
            awk '{print $3}' \
          )

          {
            echo "**Overall Coverage:** $COVERAGE"
            echo ""
            echo "### Coverage by Package"
            echo ""
            echo "| Package | Coverage |"
            echo "|---------|----------|"
            go tool cover -func=coverage.out | \
              grep -v "total:" | \
              awk '{print "| " $1 " " $2 " | " $3 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: coverage-report
          path: coverage.out

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.1'

      - name: Run go vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.1'

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
        with:
          version: v2.11.4

      - name: Run golangci-lint
        run: golangci-lint run ./...

  gomod:
    name: Go Mod Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26.1'

      - name: Run go mod tidy
        run: go mod tidy

      - name: Check for changes
        run: |
          FILES="go.mod"
          if [ -f go.sum ]; then
            FILES="$FILES go.sum"
          fi
          git diff --exit-code $FILES || (
            echo "go.mod or go.sum has uncommitted changes after 'go mod tidy'"
            exit 1
          )

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Build binary target
        run: |
          docker buildx bake binary \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

  dist:
    name: Check dist binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      - name: Rebuild dist binaries
        run: |
          docker buildx bake dist \
            --set '*.cache-from=type=gha' \
            --set '*.cache-to=type=gha,mode=max'

      - name: Check dist is up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ binaries are out of date. Run 'docker buildx bake dist' and commit the result."
            exit 1
          fi

  passed:
    name: CI passed
    needs: [test, vet, lint, gomod, build, dist]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.vet.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.gomod.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.dist.result }}" != "success" ]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ CI passed"
